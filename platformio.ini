; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

lib_deps =
	adafruit/Adafruit SH110X@^2.1.14
	adafruit/Adafruit GFX Library@^1.11.0
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^3.11.0
	arduinogetstarted/ezButton@^1.0.6

; Local modules follow the spec pattern:
;   include/<module>.h (public API)
;   lib/<module>/<module>.cpp (implementation)
build_src_filter =
	+<*>
	+<../lib/*/*.cpp>

; Build flags
; CRITICAL: NO -flto (Link Time Optimization) - absolute rule
build_flags =
	-DENABLE_SERIAL_DEBUG

monitor_speed = 115200
upload_speed = 921600
